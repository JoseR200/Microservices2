name: Test EC2

on:
  push:
    branches:
      - main

jobs:
  detectar-cambios:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      apigateway: ${{ steps.filter.outputs.apigateway }}
      config: ${{ steps.filter.outputs.config }}
      eureka: ${{ steps.filter.outputs.eureka }}
      product: ${{ steps.filter.outputs.product }}
      shopping: ${{ steps.filter.outputs.shopping }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Detectar cambios en microservicios
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            admin: 'admin-service/**'
            apigateway: 'api-gateway/**'
            config: 'config-service/**'
            eureka: 'eureka-service/**'
            product: 'product-microservice/**'
            shopping: 'shopping-microservice/**'

  deploy_admin:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Construir el .jar
        working-directory: admin-service
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Enviar el .jar a EC2
        working-directory: admin-service
        run: |
          ls
          scp -i ${{ secrets.EC2_SSH_KEY }} ./build/libs/admin-service-0.0.1-SNAPSHOT-plain.jar ${{ secrets.EC2_USER }}r@${{ secrets.EC2_HOST }}:/home/ec2-user/auth.jar

      - name: Conexión SSH al servidor EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          username: ${{ secrets.EC2_USER }}
          host: ${{ secrets.EC2_HOST }}
          script: ls /home/ec2-user

  deploy_apigateway:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.apigateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar Api Gateway en EC2
        run: echo "Deploying Api Gateway..."

  deploy_config:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar Config en EC2
        run: echo "Deploying Config Service..."

  deploy_eureka:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.eureka == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar Eureka en EC2
        run: echo "Deploying Eureka Service..."

  deploy_product:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.product == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar Product en EC2
        run: echo "Deploying Product Microservice..."

  deploy_shopping:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.shopping == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar Shopping en EC2
        run: echo "Deploying Shopping Microservice..."