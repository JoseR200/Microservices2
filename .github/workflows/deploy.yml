          host: ${{ secrets.EC2_HOST }}
          source: "/home/runner/work/Microservices2/Microservices2/config-service/build/libs/config-service-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/config.jar"

      - name: Conexión SSH al servidor EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          username: ${{ secrets.EC2_USER }}
          host: ${{ secrets.EC2_HOST }}
          script: |
            cd /home/ec2-user
            mv ./config.jar/github/workspace/config-service/build/libs/config-service-0.0.1-SNAPSHOT.jar ./Microservices2/config-service/build/libs/
            rm -r config.jar/
            cd Microservices2
            docker-compose up --build --detach config-service
            docker image prune -f

  deploy_eureka:
