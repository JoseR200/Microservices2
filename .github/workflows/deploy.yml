name: Test EC2

on:
  push:
    branches:
      - main

jobs:
  detectar-cambios:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      apigateway: ${{ steps.filter.outputs.apigateway }}
      config: ${{ steps.filter.outputs.config }}
      eureka: ${{ steps.filter.outputs.eureka }}
      product: ${{ steps.filter.outputs.product }}
      shopping: ${{ steps.filter.outputs.shopping }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Detectar cambios en microservicios
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            admin: 'admin-service/**'
            apigateway: 'api-gateway/**'
            config: 'config-service/**'
            eureka: 'eureka-service/**'
            product: 'product-microservice/**'
            shopping: 'shopping-microservice/**'

  deploy_admin:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Construir el .jar
        working-directory: admin-service
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Enviar .jar a EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          username: ${{ secrets.EC2_USER }}
          host: ${{ secrets.EC2_HOST }}
          source: "/home/runner/work/Microservices2/Microservices2/admin-service/build/libs/admin-service-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/admin.jar"

      - name: Conexión SSH al servidor EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          username: ${{ secrets.EC2_USER }}
          host: ${{ secrets.EC2_HOST }}
          script: |
            cd /home/ec2-user
            mv ./admin.jar/github/workspace/admin-service/build/libs/admin-service-0.0.1-SNAPSHOT.jar ./Microservices2/admin-service/build/libs/
            rm -r admin.jar/
            cd Microservices2
            docker-compose up --build --detach admin-service
            docker image prune -f

  deploy_apigateway:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.apigateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Construir el .jar
        working-directory: api-gateway
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Enviar .jar a EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          username: ${{ secrets.EC2_USER }}
          host: ${{ secrets.EC2_HOST }}
          source: "/home/runner/work/Microservices2/Microservices2/api-gateway/build/libs/api-gateway-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/api.jar"

      - name: Conexión SSH al servidor EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          username: ${{ secrets.EC2_USER }}
          host: ${{ secrets.EC2_HOST }}
          script: |
            cd /home/ec2-user
            mv ./api.jar/github/workspace/api-gateway/build/libs/api-gateway-0.0.1-SNAPSHOT.jar ./Microservices2/api-gateway/build/libs/
            rm -r api.jar/
            cd Microservices2
            docker-compose up --build --detach api-gateway
            docker image prune -f

  deploy_config:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Construir el .jar
        working-directory: config-service
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Enviar .jar a EC2
        uses: appleboy/scp-action@v0.1.4
