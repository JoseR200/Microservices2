            rm -r eureka.jar/
            cd Microservices2
            docker-compose up --build --detach eureka-service
            docker image prune -f

  deploy_product:
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.product == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Construir el .jar
        working-directory: product-microservice
