services:
  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "8081:8081"
    networks:
      - microservices-network
    environment:
      - GIT_USER=${GIT_USER}
      - GIT_PASSWORD=${GIT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-service:
    build: ./eureka-service
    container_name: eureka-service
    ports:
      - "8099:8099"
    networks:
      - microservices-network
    depends_on:
      config-service:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-service:
    build: ./admin-service
    container_name: admin-service
    ports:
      - "8086:8086"
    networks:
      - microservices-network
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-microservice:
    build: ./product-microservice
    container_name: product-microservice
    ports:
      - "8091:8091"
    networks:
      - microservices-network
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT}

  shopping-microservice:
    build: ./shopping-microservice
    container_name: shopping-microservice
    ports:
      - "8092:8092"
    networks:
      - microservices-network
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT}

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - microservices-network
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT}

networks:
  microservices-network:
    driver: bridge
